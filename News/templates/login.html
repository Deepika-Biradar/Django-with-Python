    <center><h4>{{msg}}</h4></center>
    <form name="frmlogin" method="post" autocomplete="off">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-4 offset-lg-4 col-sm-12 mb-2 col-md-12">
                    <font color="red"><b>Email ID</font>
                        <input type="email" name="emailid" autofocus="on" class="form-control" required placeholder="Enter Email ID">
                </div>
            </div>
            <div class="row">
                <div class="col-lg-4 offset-lg-4 col-sm-12 mb-2 col-md-12">
                    <font color="red"><b>Password</font>
                        <input type="password" name="password"  class="form-control" required placeholder="Enter Password">
                </div>
            </div>
            <center>
                <div>
                    <input  class="btn btn-success" type="submit" name="btnlogin" value="Login">
                    <input class="btn btn-warning" type="reset" name="btncancel" value="Cancel">
                </div>
            </center>
