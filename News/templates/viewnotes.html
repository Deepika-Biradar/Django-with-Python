<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-uWxY/CJNBR+1zjPWmfnSnVxwRheevXITnMqoEIeG1LJrdI0GlVs/9cVSyPYXdcSF"
      crossorigin="anonymous"
    />

    <title>QuickNews | Catch the Headlines,Instantly</title>
  </head>
  <body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">QuickNews</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index">Home</a>
            </li>
           
         
          <a href="notes" class="btn btn-primary mx-2">Save Highlights</a>
          <td><a href="{{n.notesdata.url}}" class="btn btn-primary mx-2" download="{{n.notesdata.url}}">Share</a></td> 
          
        </div>
      </div>
    </nav>
   
    <style>
        body {
          background-image: url(https://t4.ftcdn.net/jpg/01/31/03/27/360_F_131032753_rtJFz24qqksXnZsPFJ3ZDcd21zgxUvnB.jpg);
          background-repeat: no-repeat;
          background-attachment: fixed;
          background-size: 100% 100%;
        }
      </style>
       <h1 class="text-center text-dark">QuickNews | Highlights Only</h1>
    <center><h3>Download Notes</h3></center>
    
    <table align="center" border="1" class="table table-bordered">
	<tr>
		
		<th>Uploaded By</th>
        <th>Subject</th>
       
		
		<th>Delete</th>
	</tr>
	
	{% for n in notesdata %}
	<tr>
       
		<td>{{n.fullname}}</td>
		<td>{{n.subject}}</td>
    
        

		
		<td>
		<form name="frm" method="post">
		<input type="hidden" name="subject" value="{{n.subject}}">
		<input class="btn btn-danger" type="submit" name="delete" value="X">	
		{%csrf_token%}
		</form>
	</td>
    </tr>
    {% endfor %}
</table>

    
    
    
    {% csrf_token %}
{% include "last.html" %}
  </body>
</html>
