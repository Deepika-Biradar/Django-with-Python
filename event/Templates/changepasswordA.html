<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change Password</title>
	{% include "head.html"%}

</head>
<body background="https://imgv3.fotor.com/images/share/Free-blue-gradient-pattern-background-from-Fotor.jpg">
	{% include "htemp.html"%}
	
<br>
    <center><h1><b>EVENT ORGANIZER</b></h1></center>
<br><br>
	<center>
<h4>Change Password</h4>
</center>
<center>
	<font color="red"> {{msg}}</font>
</center>
<table width="60%" align="center">
<tr>
	<td>
		<form name="frm" method="post">
			<font color="red">*</font>Current Password
			<input type="password" name="currentpassword" class="form-control" required autofocus="on">
			<font color="red">*</font>New Password
			<input type="password" name="newpassword" class="form-control" required>
			<font color="red">*</font>Confirm New Password
			<input type="password" name="confirmnewpassword" class="form-control" required>
			<br/>
			<center>
				<input class="btn btn-success" type="submit" name="btnsubmit" value="Change Password">
     			<input class="btn btn-warning" type="reset" name="cancel" value="Cancel">
     
			</center>
			{%csrf_token%}
			
		</form>
	</td>
</tr>
	
</table>
</body>
</html>
